<ng-template [ngIf]="!data.meta!.fiber">
<ng-template [ngIf]="view$ | async" [ngIfElse]="spinnerTmpl" let-view>

  <mat-action-list>
    <button *ngIf="data.filename"
      
      mat-list-item>
      <!-- <mat-icon mat-list-item-icon>
        <mat-icon>file</mat-icon>
      </mat-icon> -->
      <span mat-list-item-title>{{ data.filename }}</span>
    </button>
    
    <ng-template [ngIf]="data.actions" let-actions>
      <ng-template ngFor [ngForOf]="actions" let-action>
        <button mat-list-item-icon (click)="action.action()">
          <sxplr-icon mat-list-item-icon [icon]="action">
          </sxplr-icon>
          <span mat-list-item-title>{{ action }}</span>
        </button>
      </ng-template>
    </ng-template>

  </mat-action-list>

  <ng-template [ngIf]="data.layerName">
    <ng-layer-tune
      advanced-control="true"
      [ngLayerName]="data.layerName"
      [thresholdMax]="data.meta.max || 1"
      [thresholdMin]="data.meta.min || 0">
    </ng-layer-tune>
  </ng-template>
</ng-template>
</ng-template>

<ng-template #spinnerTmpl>
  <div>
    <spinner-cmp class="spinner"></spinner-cmp>
  </div>
</ng-template>

<ng-template [ngIf]="data.meta?.ptcld" let-ptcld>
  <ptcld-ui
    [bucketname]="ptcld.bucketname"
    [fname]="ptcld.fname">
  </ptcld-ui>
</ng-template>

<ng-template [ngIf]="data.meta?.fiber" let-fiber>
  <geomsvc-fiber
    [bucketname]="fiber.bucketname"
    [fname]="fiber.fname"
    >
  </geomsvc-fiber>
</ng-template>

@if (data.meta?.dpTrx; as dpTrx) {
  <div>
    data-proxy TRX grouped viewer
  </div>
  
  @if(dpTrx.uuid; as uuid) {


    <a [href]="uuid | toUiPipe"
      target="_blank"
      mat-stroked-button>
      <span>
        Open TRX file in data-proxy
      </span>
      <mat-icon matSuffix>open_in_new</mat-icon>
    </a>

    <button mat-button
    [iav-clipboard-copy]="uuid | toUiPipe"
      >
      Copy URL
    </button>
    
    <trx-group-selector [uuid]="uuid"></trx-group-selector>
  }
}
