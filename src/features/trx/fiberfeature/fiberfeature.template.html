<div>fiber visualization</div>


@if (view$ | async; as view) {
    @if(view.overviewLevels.length > 0){
        <mat-form-field class="compact" appearance="outline">
            <mat-label>overview</mat-label>
            <mat-select [formControl]="overviewSelection">
                <mat-option [value]="null">--</mat-option>
                @for (item of view.overviewLevels; track item.path) {
                    <mat-option [value]="item.path">{{ item.name }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    }

    <trx-group-selector
        [uuid]="view.uuid"
        (groupSelected)="handleGroupSelected($event)">
    </trx-group-selector>
}
