<div>fiber visualization</div>

@if (view$ | async; as view) {
    @if (view.bundlenames.length > 0) {
        <mat-form-field class="compact" appearance="outline">
            <mat-label>select a fiber</mat-label>
            <mat-select [formControl]="selectedFiber">
                <mat-option [value]="null" class="muted">(hide)</mat-option>
                @for (bundle of view.bundlenames; track bundle.fibername) {
                    <mat-option [value]="bundle.fibername">
                        {{ bundle.fibername }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>
    }
}
